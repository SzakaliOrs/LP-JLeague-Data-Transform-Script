<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J-League Schedule Converter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="back-link" href="index.html">← Back to leagues</a>
<h1 id="pageTitle">J-League Schedule → Liquipedia Converter</h1>

<div class="options">
  <label for="season">Season
    <select id="season"></select>
  </label>
</div>

<figure class="hint">
  <p>On the J-League schedule search results page, select the results table — from the <strong>Season</strong> column through the <strong>Away</strong> column — copy it, and paste it into the box below.</p>
  <img src="example-schedule.png" alt="Example: J-League schedule search results table, showing the Season through Away columns to select and copy.">
</figure>

<ul class="notes">
  <li>Generates code for one round at a time — paste the rows for a single matchweek only.</li>
  <li>Include the table headers row (Season, Tournaments, Sec, ...) in what you paste.</li>
  <li>Currently supports J1, J2, and J3 Matchlists only.</li>
</ul>

<div class="converter">
  <textarea id="input" placeholder="Paste the tab-separated schedule export here..." spellcheck="false"></textarea>

  <div class="controls">
    <button id="convertBtn">Convert →</button>
    <p id="status"></p>
  </div>

  <div class="output-wrap">
    <textarea id="output" placeholder="Output will appear here..." spellcheck="false" readonly></textarea>
    <button id="copyBtn" type="button">Copy</button>
  </div>
</div>

<script src="common.js"></script>
<script src="jleague.js"></script>
</body>
</html>
